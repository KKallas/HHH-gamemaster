<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>2P Tag Game Player</title>
<link rel="stylesheet" href="/theme.css" />
<style>
  main { max-width: 1180px; margin: 0 auto; padding: 12px 20px 20px; }
  main[hidden], .briefing[hidden], .missionPanel[hidden], .briefingVideo[hidden],
  .namePanel[hidden], .firstIntroPanel[hidden] { display:none; }
  .briefing {
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:18px;
    background:#020403;
  }
  .briefingVideo {
    width:min(100%, 1120px);
    max-height:calc(100vh - 36px);
    border:1px solid rgba(75, 255, 112, 0.28);
    border-radius:8px;
    background:#000;
    box-shadow:0 0 34px rgba(75, 255, 112, 0.14);
    cursor:pointer;
  }
  .namePanel {
    width:min(100%, 620px);
    display:grid;
    gap:14px;
    padding:22px;
    border:1px solid rgba(75, 255, 112, 0.3);
    border-radius:8px;
    background:linear-gradient(180deg, #07110c 0%, #020403 100%);
    box-shadow:0 0 34px rgba(75, 255, 112, 0.14);
  }
  .namePanel h1 {
    margin:0;
    color:#4bff70;
    font-size:24px;
    font-weight:900;
    letter-spacing:0;
    text-transform:uppercase;
    text-shadow:0 0 14px rgba(75, 255, 112, 0.62);
  }
  .namePanel label {
    display:grid;
    gap:8px;
    color:rgba(244, 247, 251, 0.78);
    font-size:13px;
    font-weight:800;
    text-transform:uppercase;
  }
  .namePanel input {
    min-height:52px;
    border:1px solid rgba(21, 247, 255, 0.34);
    border-radius:8px;
    background:#020505;
    color:#f4f7fb;
    padding:8px 12px;
    font:800 20px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .namePanel button, #missionStartButton {
    min-height:54px;
    border:1px solid #4bff70;
    background:#4bff70;
    color:#001b07;
    font-size:18px;
    font-weight:900;
    box-shadow:0 0 20px rgba(75, 255, 112, 0.3);
  }
  .firstIntroPanel {
    width:min(100%, 1080px);
    max-height:calc(100vh - 36px);
    display:grid;
    grid-template-rows:1fr auto;
    gap:14px;
  }
  .firstIntroText {
    overflow:auto;
    column-count:2;
    column-gap:34px;
    padding:20px;
    border:1px solid rgba(75, 255, 112, 0.36);
    border-radius:8px;
    background:#020403;
    color:#4bff70;
    font:800 16px/1.48 "Share Tech Mono", "Orbitron", "Rajdhani", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing:0;
    text-shadow:0 0 8px rgba(75, 255, 112, 0.74), 0 0 18px rgba(21, 247, 255, 0.22);
    box-shadow:inset 0 0 34px rgba(21, 247, 255, 0.08), 0 0 30px rgba(75, 255, 112, 0.12);
  }
  .introLine {
    min-height:1.48em;
    break-inside:avoid;
    opacity:0;
    transform:translateY(5px);
    transition:opacity 420ms ease, transform 420ms ease;
  }
  .introLine.visible {
    opacity:1;
    transform:translateY(0);
  }
  .missionPanel {
    width:min(100%, 980px);
    max-height:calc(100vh - 36px);
    display:grid;
    grid-template-rows:1fr auto;
    gap:14px;
  }
  .missionText {
    margin:0;
    overflow:auto;
    padding:18px;
    border:1px solid rgba(21, 247, 255, 0.34);
    border-radius:8px;
    background:linear-gradient(180deg, #020505 0%, #000 42%, #020403 100%);
    color:#4bff70;
    font:700 clamp(12px, 1.45vw, 17px)/1.55 "Share Tech Mono", "Orbitron", "Rajdhani", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing:0;
    white-space:pre-wrap;
    text-shadow:0 0 8px rgba(75, 255, 112, 0.74), 0 0 18px rgba(21, 247, 255, 0.22);
    box-shadow:inset 0 0 34px rgba(21, 247, 255, 0.08), 0 0 30px rgba(75, 255, 112, 0.12);
  }
  .missionLine {
    min-height:1.55em;
    opacity:0;
    transform:translateY(5px);
    transition:opacity 420ms ease, transform 420ms ease;
    white-space:pre-wrap;
  }
  .missionLine.visible {
    opacity:1;
    transform:translateY(0);
  }
  .readyBar {
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
  }
  #readyButton, #relayConnectButton {
    min-height:54px;
    border:1px solid #4bff70;
    background:#4bff70;
    color:#001b07;
    font-size:18px;
    font-weight:900;
    box-shadow:0 0 20px rgba(75, 255, 112, 0.3);
    padding:0 22px;
  }
  #relayConnectButton {
    border-color:rgba(21, 247, 255, 0.72);
    background:#15f7ff;
    color:#001418;
    box-shadow:0 0 20px rgba(21, 247, 255, 0.24);
  }
  #readyButton:disabled {
    border-color:rgba(255, 255, 255, 0.18);
    background:#242932;
    color:#7d8795;
    box-shadow:none;
  }
  .playerState {
    display:grid;
    grid-template-columns: minmax(120px, 0.8fr) repeat(3, minmax(150px, 1fr));
    gap:10px;
    align-items:stretch;
    margin-bottom:12px;
  }
  .playerNameCard {
    display:flex;
    align-items:center;
    min-width:0;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#13161c;
    color:var(--txt);
    font-size:13px;
    font-weight:850;
  }
  .playerNameCard span {
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:12px; }
  .stat { background:#13161c; border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .stat .k { color:var(--muted); font-size:11px; font-weight:800; text-transform:uppercase; }
  .stat .v { margin-top:2px; font-size:24px; font-weight:900; font-variant-numeric:tabular-nums; }
  .axis { margin:18px 0; }
  .axis .label { display:flex; justify-content:space-between; gap:10px; margin-bottom:8px; }
  .axis .name { font-weight:800; }
  .axis .val { color:var(--accent); font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; height:32px; accent-color:var(--accent); }
  button { min-height:40px; }
  input:disabled, button:disabled { opacity:.48; }
  .armHeader { display:flex; gap:14px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
  .armHeader h2 { margin:0; }
  .pumpRow { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .pumpRow button.active { background:var(--ok); border-color:var(--ok); color:#07140a; font-weight:850; }
  .pumpRow button.blow.active { background:var(--warn); border-color:var(--warn); color:#241900; }
  .feedWrap {
    position:relative;
    overflow:hidden;
    border:1px solid var(--line);
    border-radius:8px;
    background:#030405;
    aspect-ratio:16 / 9;
  }
  #webcamFeed {
    width:100%;
    height:100%;
    display:block;
    object-fit:contain;
  }
  .countdownOverlay {
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    background:rgba(0, 0, 0, 0.42);
    color:#4bff70;
    font-size:clamp(72px, 18vw, 180px);
    font-weight:950;
    font-variant-numeric:tabular-nums;
    text-align:center;
    white-space:pre-line;
    text-shadow:0 0 18px rgba(75, 255, 112, 0.82), 0 0 42px rgba(21, 247, 255, 0.34);
  }
  .countdownOverlay.winScreen {
    font-size:clamp(38px, 9vw, 118px);
  }
  .countdownOverlay[hidden] { display:none; }
  .hint { color:var(--muted); font-size:12px; }
  #countdown { line-height:1; }
  #distanceValue.inside { color:var(--ok); }
  #distanceValue.outside { color:#ff4d5d; }
  #distanceValue.missing { color:var(--muted); }
  @media (max-width: 760px) {
    .playerState { grid-template-columns:1fr; }
    .armHeader { align-items:flex-start; flex-direction:column; }
    .readyBar { align-items:stretch; flex-direction:column; }
    .firstIntroText { column-count:1; }
  }
</style>
</head>
<body>
<section id="briefing" class="briefing" aria-label="mission briefing">
  <form id="namePanel" class="namePanel" autocomplete="off">
    <h1>Command login</h1>
    <label for="playerNameInput">Player name</label>
    <input id="playerNameInput" list="playerNameOptions" maxlength="32" autocomplete="off" required />
    <datalist id="playerNameOptions"></datalist>
    <button id="playerNameButton" type="submit">Continue</button>
    <span id="playerNameStatus" class="hint">Enter your name to begin.</span>
  </form>
  <video id="originVideo" class="briefingVideo" src="/Video0.mp4" muted playsinline title="Click to skip" hidden></video>
  <div id="firstIntroPanel" class="firstIntroPanel" hidden>
    <div id="firstIntroText" class="firstIntroText"></div>
    <button id="missionStartButton" type="button">Start your mission</button>
  </div>
  <video id="introVideo" class="briefingVideo" src="/Video1.mp4" muted playsinline title="Click to skip" hidden></video>
  <div id="missionPanel" class="missionPanel" hidden>
    <div id="missionText" class="missionText"></div>
    <div class="readyBar">
      <button id="relayConnectButton" type="button">Relay Connect</button>
      <button id="readyButton" type="button" disabled>Ready</button>
      <span id="readyStatus" class="hint">Connect relay first, then press Ready.</span>
    </div>
  </div>
</section>

<main id="gameShell" hidden>
  <section class="playerState" aria-label="player game state">
    <div class="playerNameCard">
      <span id="playerNameInline">waiting for gamemaster</span>
    </div>
    <div class="stat"><div id="clockLabel" class="k">Time left</div><div id="countdown" class="v">--</div></div>
    <div class="stat"><div class="k">Distance to target</div><div id="distanceValue" class="v missing">-- mm</div></div>
    <div class="stat"><div class="k">Tag</div><div id="pickupState" class="v">Waiting</div></div>
  </section>

  <section class="panel" aria-label="live camera feed">
    <div class="feedWrap">
      <img id="webcamFeed" alt="live game camera feed" />
      <div id="playerCountdownOverlay" class="countdownOverlay" hidden>5</div>
    </div>
  </section>

  <section class="panel">
    <div class="armHeader">
      <h2>Arm controls</h2>
      <div class="pumpRow">
        <button id="pumpSuck" type="button" disabled>Vacuum</button>
        <button id="pumpBlow" class="blow" type="button" disabled>Blow</button>
        <button id="pumpOff" type="button" disabled>Off</button>
        <span id="pumpStatus" class="hint">pump off</span>
      </div>
    </div>
    <div id="axes"></div>
    <p id="armStatus" class="hint">Controls unlock when the gamemaster starts your team.</p>
  </section>
</main>

<script>
const TEAM = (location.pathname.match(/\/s\/([^/]+)/) || [])[1] === 'green' ? 'green' : 'purple';
const GM = `${location.origin}/s/gamemaster/p/2p-tag-game`;
const WEBCAM = `${location.origin}/s/gamemaster/p/webcam/api/stream`;
const JOINT = `${location.origin}/s/${TEAM}/p/joint-angles-test`;
const ROUND_SECONDS = 90;
const PLAYER_NAME_HISTORY_KEY = '2p-tag-game-player-names';
const AXES = [
  { id: 'j1', label: 'J1 — base rotation' },
  { id: 'j2', label: 'J2 — arm joint 1' },
  { id: 'j3', label: 'J3 — arm joint 2' },
];
let limits = { j1: [-160, 160], j2: [-25, 85], j3: [-25, 105] };
let game = null;
let currentJoints = [0, 0, 0, 0];
let sliders = {};
let armReady = false;
let armStarting = false;
let lastRunKey = '';
let assignedPlayerName = '';
let pumpMode = 'off';
let playerReady = false;
let relayReady = false;
let nameSubmitted = false;
let missionTextShown = false;
let briefingStage = 'name';
let missionTimers = [];
let countdownTimer = 0;
let countdownEndsAtMs = 0;
let countdownKey = '';
let gameClockTimer = 0;
let gameEndsAtMs = 0;
let gameClockKey = '';
let goOverlayTimer = 0;
let gameOverShown = false;
let winShown = false;

const el = id => document.getElementById(id);

const MISSION_TEMPLATE = [
  'When automation became too complex, too expensive, and too centralized.',
  'Then',
  '',
  'Nobody could fix it.',
  'Nobody could question it.',
  'Nobody could override it.',
  '',
  'So the wise ones from the future sent back blueprints for a simple automation system.',
  'Your job: rebuild the system one layer at a time.',
  'Level 1 — Blueprint One: Movement',
  'Why',
  '',
  'Before automation can help, humans must understand control.',
  '',
  'If you cannot move the system yourself, you do not control it.',
  '',
  'Your Mission',
  '',
  'Move the tags manually, without hitting the other robot arm.',
  'The Purple moves a Purple tag to the Green area',
  'The Green moves a green tag to the Purple area',
  '',
  'Place them where they need to go.',
  '',
  'Learn how hard simple movement is when a machine must do it exactly.',
];

function cleanName(value) {
  return String(value || '').trim().slice(0, 32);
}

function teamGameState(state = game) {
  return state && state.teams && state.teams[TEAM] ? state.teams[TEAM] : {};
}

function teamIsActive(state = game) {
  return !!(state && (
    state.active_team === TEAM
    || state.active_team === 'both'
    || state.mode === 'two_player'
    || (Array.isArray(state.active_teams) && state.active_teams.includes(TEAM))
  ));
}

function ownRoundResult(state = game) {
  const result = state && state.round_result;
  if (result && result.results && result.results[TEAM]) return result.results[TEAM];
  if (result && result.team === TEAM) return result;
  return null;
}

function teamLabel(value) {
  const text = String(value || '');
  return text ? text[0].toUpperCase() + text.slice(1) : '';
}

function nameKey(value) {
  return cleanName(value).toLowerCase().replace(/\s+/g, ' ');
}

function loadJsonStorage(key, fallback) {
  try {
    const value = JSON.parse(localStorage.getItem(key) || 'null');
    return value === null ? fallback : value;
  } catch (_) {
    return fallback;
  }
}

function playerNameHistory() {
  const names = loadJsonStorage(PLAYER_NAME_HISTORY_KEY, []);
  return Array.isArray(names) ? names.map(cleanName).filter(Boolean) : [];
}

function savePlayerNameHistory(names) {
  const seen = new Set();
  const cleanNames = [];
  for (const name of names.map(cleanName).filter(Boolean)) {
    const key = nameKey(name);
    if (seen.has(key)) continue;
    seen.add(key);
    cleanNames.push(name);
  }
  localStorage.setItem(PLAYER_NAME_HISTORY_KEY, JSON.stringify(cleanNames.slice(0, 24)));
}

function rememberPlayerName(name) {
  savePlayerNameHistory([name, ...playerNameHistory()]);
  renderPlayerNameOptions();
}

function renderPlayerNameOptions() {
  const query = nameKey(el('playerNameInput').value);
  const options = playerNameHistory()
    .filter(name => !query || nameKey(name).includes(query))
    .slice(0, 8);
  el('playerNameOptions').innerHTML = '';
  for (const name of options) {
    const option = document.createElement('option');
    option.value = name;
    el('playerNameOptions').appendChild(option);
  }
}

function setBriefingStage(stage) {
  briefingStage = stage;
  el('namePanel').hidden = stage !== 'name';
  el('originVideo').hidden = true;
  el('firstIntroPanel').hidden = true;
  el('introVideo').hidden = true;
  el('missionPanel').hidden = stage !== 'levelText';
}

function startWebcamStream() {
  el('webcamFeed').src = `${WEBCAM}?t=${Date.now()}`;
}

function showMissionText() {
  missionTextShown = true;
  renderMissionText();
  setBriefingStage('levelText');
}

function showBriefing() {
  el('briefing').hidden = false;
  el('gameShell').hidden = true;
  setBriefingStage(briefingStage);
}

function showGameShell() {
  el('briefing').hidden = true;
  el('gameShell').hidden = false;
}

function renderMissionText() {
  for (const timer of missionTimers) clearTimeout(timer);
  missionTimers = [];
  el('missionText').innerHTML = '';
  MISSION_TEMPLATE.forEach((line, index) => {
    const item = document.createElement('div');
    item.className = 'missionLine';
    item.textContent = line;
    el('missionText').appendChild(item);
    missionTimers.push(setTimeout(() => item.classList.add('visible'), 160 * index));
  });
}

function resetBriefingForNextRun() {
  missionTextShown = false;
  nameSubmitted = false;
  for (const timer of missionTimers) clearTimeout(timer);
  missionTimers = [];
  el('playerNameButton').disabled = false;
  el('playerNameStatus').textContent = 'Enter your name to begin.';
  if (assignedPlayerName) el('playerNameInput').value = assignedPlayerName;
  renderPlayerNameOptions();
  setBriefingStage('name');
}

async function submitPlayerName(event) {
  event.preventDefault();
  const name = cleanName(el('playerNameInput').value);
  if (!name) {
    el('playerNameStatus').textContent = 'Enter your name to begin.';
    return;
  }
  el('playerNameButton').disabled = true;
  el('playerNameStatus').textContent = 'Registering player...';
  try {
    const state = await jsonFetch(`${GM}/api/player`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ team: TEAM, name }),
    });
    assignedPlayerName = name;
    nameSubmitted = true;
    rememberPlayerName(name);
    if (state) applyGameState(state);
    showMissionText();
  } catch (err) {
    el('playerNameButton').disabled = false;
    el('playerNameStatus').textContent = `Name failed: ${err.message}`;
  }
}

function setScreenOverlay(text, showOverlay, mode = '') {
  const overlay = el('playerCountdownOverlay');
  overlay.hidden = !showOverlay;
  overlay.textContent = text;
  overlay.classList.toggle('winScreen', mode === 'win');
}

function stopTopCountdown() {
  clearInterval(countdownTimer);
  countdownTimer = 0;
  countdownKey = '';
}

function stopGameClock() {
  clearInterval(gameClockTimer);
  gameClockTimer = 0;
  gameClockKey = '';
}

function updateTopCountdownTick() {
  const remaining = Math.ceil((countdownEndsAtMs - Date.now()) / 1000);
  el('countdown').textContent = remaining > 0 ? String(remaining) : 'GO';
}

function startTopCountdown(startsAt, serverNow) {
  const key = `${TEAM}:${Number(startsAt).toFixed(3)}`;
  if (countdownKey === key && countdownTimer) return;
  countdownKey = key;
  countdownEndsAtMs = Date.now() + Math.max(0, (Number(startsAt) - Number(serverNow)) * 1000);
  clearInterval(countdownTimer);
  countdownTimer = setInterval(updateTopCountdownTick, 120);
  updateTopCountdownTick();
}

function updateGameClockTick() {
  const remaining = Math.max(0, Math.ceil((gameEndsAtMs - Date.now()) / 1000));
  el('countdown').textContent = String(remaining);
  if (remaining <= 0) showGameOver();
}

function startGameClock(startsAt, serverNow) {
  const key = `${TEAM}:${Number(startsAt).toFixed(3)}:${ROUND_SECONDS}`;
  if (gameClockKey === key && gameClockTimer) return;
  gameClockKey = key;
  gameEndsAtMs = Date.now()
    + Math.max(0, (Number(startsAt) + ROUND_SECONDS - Number(serverNow)) * 1000);
  clearInterval(gameClockTimer);
  gameClockTimer = setInterval(updateGameClockTick, 250);
  updateGameClockTick();
}

function showGoBriefly() {
  setScreenOverlay('GO', true);
  clearTimeout(goOverlayTimer);
  goOverlayTimer = setTimeout(() => {
    if (!gameOverShown && !winShown) el('playerCountdownOverlay').hidden = true;
  }, 900);
}

function showGameOver() {
  if (gameOverShown) return;
  gameOverShown = true;
  winShown = false;
  stopTopCountdown();
  stopGameClock();
  el('countdown').textContent = '0';
  setScreenOverlay('GAME OVER', true);
  setControlLock();
}

function secondsText(value) {
  return value !== null && value !== undefined && Number.isFinite(Number(value))
    ? `${Number(value).toFixed(1)}s`
    : '--';
}

function showWin(result = null) {
  if (winShown) return;
  winShown = true;
  gameOverShown = false;
  stopTopCountdown();
  stopGameClock();
  el('clockLabel').textContent = 'Result';
  const didWin = !result || !result.team || result.team === TEAM;
  el('countdown').textContent = didWin ? 'WIN' : '0';
  const best = result && Number.isFinite(Number(result.overall_best_win_seconds))
    ? `\nBest time ${secondsText(result.overall_best_win_seconds)}`
    : '';
  setScreenOverlay(didWin ? `YOU WIN${best}` : `${teamLabel(result && result.team)} TEAM WINS`, true, didWin ? 'win' : '');
  setControlLock();
}

async function markReady() {
  if (!nameSubmitted) {
    el('readyStatus').textContent = 'Enter your name first.';
    setBriefingStage('name');
    return;
  }
  if (!relayReady) {
    el('readyStatus').textContent = 'Connect relay first.';
    return;
  }
  el('readyButton').disabled = true;
  el('readyStatus').textContent = 'Sending ready signal...';
  try {
    await jsonFetch(`${GM}/api/ready`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ team: TEAM, ready: true }),
    });
    playerReady = true;
    el('readyStatus').textContent = 'Ready sent.';
    showGameShell();
    setControlLock();
  } catch (err) {
    el('readyButton').disabled = !relayReady;
    el('readyStatus').textContent = `Ready signal failed: ${err.message}`;
  }
}

function applyRelayReady(ready) {
  relayReady = !!ready;
  el('readyButton').disabled = !relayReady || playerReady;
  el('relayConnectButton').disabled = relayReady;
  if (relayReady && !playerReady) {
    el('readyStatus').textContent = 'Relay connected. Press Ready.';
  } else if (!relayReady && !playerReady) {
    el('readyStatus').textContent = 'Connect relay first, then press Ready.';
  }
}

async function connectRelayForBriefing() {
  el('relayConnectButton').disabled = true;
  el('readyButton').disabled = true;
  el('readyStatus').textContent = 'Connecting relay...';
  try {
    const connected = await jsonFetch(`${JOINT}/api/connect`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode: 'relay' }),
    });
    if (connected.ok === false) throw new Error(connected.error || 'connect failed');
    if (connected.link && connected.link !== 'relay') throw new Error('relay not active');
    applyRelayReady(true);
  } catch (err) {
    relayReady = false;
    el('readyButton').disabled = true;
    el('relayConnectButton').disabled = false;
    el('readyStatus').textContent = `Relay failed: ${err.message}`;
  }
}

async function jsonFetch(url, opts = {}) {
  const res = await fetch(url, opts);
  const text = await res.text();
  let data = {};
  try { data = text ? JSON.parse(text) : {}; } catch (_) {}
  if (!res.ok) throw new Error(data.error || text || `HTTP ${res.status}`);
  return data;
}

function buildAxes() {
  el('axes').innerHTML = AXES.map(axis => {
    const [lo, hi] = limits[axis.id] || [-160, 160];
    return `
      <div class="axis">
        <div class="label"><span class="name">${axis.label}</span><span id="${axis.id}Val" class="val">0.0°</span></div>
        <input id="${axis.id}" type="range" min="${lo}" max="${hi}" step="0.5" value="0" disabled />
      </div>
    `;
  }).join('');
  for (const axis of AXES) {
    sliders[axis.id] = el(axis.id);
    sliders[axis.id].addEventListener('input', () => {
      el(`${axis.id}Val`).textContent = `${Number(sliders[axis.id].value).toFixed(1)}°`;
      sendMoveSoon();
    });
  }
}

function canOperate() {
  return game && game.phase === 'running' && teamIsActive(game) && !ownRoundResult(game) && assignedPlayerName && playerReady;
}

function setControlLock() {
  const enabled = !gameOverShown && !winShown && !!canOperate() && armReady;
  for (const axis of AXES) sliders[axis.id].disabled = !enabled;
  for (const id of ['pumpSuck', 'pumpBlow', 'pumpOff']) el(id).disabled = !enabled;
}

function runKey() {
  return game ? `${game.phase}:${teamIsActive(game) ? TEAM : game.active_team}:${game.game_started_at || ''}` : '';
}

async function ensureArmReady() {
  if (!canOperate() || armReady || armStarting) return;
  const key = runKey();
  if (lastRunKey === key) return;
  lastRunKey = key;
  armStarting = true;
  el('armStatus').textContent = 'Connecting to your arm...';
  try {
    const connected = await jsonFetch(`${JOINT}/api/connect`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode: 'relay' }),
    });
    if (connected.ok === false) throw new Error(connected.error || 'connect failed');
    const enabled = await jsonFetch(`${JOINT}/api/enable`, { method: 'POST' });
    if (enabled.ok === false) throw new Error(enabled.error || 'enable failed');
    armReady = true;
    el('armStatus').textContent = 'Arm live. Use J1, J2, and J3.';
  } catch (err) {
    armReady = false;
    lastRunKey = '';
    el('armStatus').textContent = `Arm not ready: ${err.message}`;
  } finally {
    armStarting = false;
    setControlLock();
  }
}

let moveTimer = 0;
function sendMoveSoon() {
  clearTimeout(moveTimer);
  moveTimer = setTimeout(sendMove, 70);
}

async function sendMove() {
  if (!canOperate() || !armReady) return;
  const body = {
    j1: Number(sliders.j1.value),
    j2: Number(sliders.j2.value),
    j3: Number(sliders.j3.value),
    j4: Number.isFinite(Number(currentJoints[3])) ? Number(currentJoints[3]) : 0,
  };
  try {
    const res = await jsonFetch(`${JOINT}/api/move`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (res.ok === false) throw new Error(res.error || 'move failed');
  } catch (err) {
    el('armStatus').textContent = `Move blocked: ${err.message}`;
  }
}

async function sendPump(mode) {
  if (!canOperate() || !armReady) return;
  try {
    const res = await jsonFetch(`${JOINT}/api/pump`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode }),
    });
    if (res.ok === false) throw new Error(res.error || 'pump failed');
    applyPumpMode(mode);
  } catch (err) {
    el('pumpStatus').textContent = `pump blocked: ${err.message}`;
  }
}

function applyPumpMode(mode) {
  pumpMode = mode || 'off';
  el('pumpSuck').classList.toggle('active', pumpMode === 'suck');
  el('pumpBlow').classList.toggle('active', pumpMode === 'blow');
  el('pumpOff').classList.toggle('active', pumpMode === 'off');
  el('pumpStatus').textContent = `pump ${pumpMode === 'suck' ? 'vacuum' : pumpMode}`;
}

function updateDistance(state) {
  const teamState = teamGameState(state);
  const d = Number(teamState.distance_mm ?? (state && state.distance_mm));
  const radius = Math.max(1, Number(teamState.active_radius_mm ?? (state && state.active_radius_mm)) || 30);
  const out = el('distanceValue');
  if (!Number.isFinite(d)) {
    out.textContent = '-- mm';
    out.className = 'v missing';
    out.style.color = '';
    return;
  }
  out.textContent = `${d.toFixed(0)} mm`;
  if (d <= radius) {
    out.className = 'v inside';
    out.style.color = '';
    return;
  }
  out.className = 'v outside';
  out.style.color = '';
}

function applyGameState(state) {
  const priorPhase = game && game.phase;
  game = state || {};
  const active = teamIsActive(game);
  const phase = game.phase || 'setup';
  const ownResult = ownRoundResult(game);
  assignedPlayerName = cleanName(game && game.players && game.players[TEAM]);
  if (assignedPlayerName && !cleanName(el('playerNameInput').value)) {
    el('playerNameInput').value = assignedPlayerName;
    renderPlayerNameOptions();
  }
  playerReady = !!(game && game.ready && game.ready[TEAM]);
  if (playerReady) applyRelayReady(true);
  const serverNow = Number(game.server_time) || Date.now() / 1000;
  const startsAt = Number(game.game_started_at);
  const remaining = Number.isFinite(startsAt) ? Math.max(0, Math.ceil(startsAt - serverNow)) : null;
  const roundExpired = Number.isFinite(startsAt) && serverNow >= startsAt + ROUND_SECONDS;

  if (priorPhase && priorPhase !== 'setup' && phase === 'setup' && !playerReady) {
    resetBriefingForNextRun();
  }

  el('playerNameInline').textContent = assignedPlayerName || 'waiting for gamemaster';
  if (phase === 'countdown' && active && Number.isFinite(startsAt)) {
    gameOverShown = false;
    winShown = false;
    stopGameClock();
    el('clockLabel').textContent = 'Start';
    startTopCountdown(startsAt, serverNow);
    setScreenOverlay('Get Ready', true);
  } else if (phase === 'running' && active && ownResult && ownResult.state === 'won') {
    showWin(ownResult);
    el('armStatus').textContent = 'You won. The other team may continue until time ends.';
  } else if (phase === 'running' && active) {
    stopTopCountdown();
    el('clockLabel').textContent = 'Time left';
    if (roundExpired) showGameOver();
    else if (Number.isFinite(startsAt)) {
      gameOverShown = false;
      winShown = false;
      startGameClock(startsAt, serverNow);
    }
    else el('countdown').textContent = String(ROUND_SECONDS);
    if (priorPhase === 'countdown') showGoBriefly();
    else if (!gameOverShown) el('playerCountdownOverlay').hidden = true;
  } else if (phase === 'ended' && active) {
    if (ownResult && ownResult.state === 'won') showWin(ownResult);
    else showGameOver();
  } else if (phase === 'won' && active) {
    showWin(ownResult || game.round_result || null);
  } else {
    gameOverShown = false;
    winShown = false;
    stopTopCountdown();
    stopGameClock();
    el('clockLabel').textContent = 'Time left';
    el('countdown').textContent = '--';
    el('playerCountdownOverlay').hidden = true;
  }
  el('pickupState').textContent = teamGameState(game).pickup_state || game.pickup_state || 'Waiting';
  updateDistance(game);
  if (playerReady && nameSubmitted) {
    showGameShell();
  } else {
    el('readyButton').disabled = !relayReady;
    showBriefing();
  }

  if (phase !== 'running') {
    if (armReady) {
      armReady = false;
      setControlLock();
    }
    if (phase === 'setup') lastRunKey = '';
    el('armStatus').textContent = ownResult && ownResult.state === 'won'
      ? 'You won. Waiting for reset.'
      : phase === 'ended' && active
        ? 'Round ended. Waiting for reset.'
        : active
          ? 'Waiting for the gamemaster countdown.'
          : 'Waiting for the gamemaster to select your team.';
  }
  setControlLock();
  if (phase === 'running') ensureArmReady();
}

async function init() {
  setBriefingStage('name');
  renderPlayerNameOptions();
  el('namePanel').addEventListener('submit', submitPlayerName);
  el('playerNameInput').addEventListener('input', renderPlayerNameOptions);
  el('readyButton').addEventListener('click', markReady);
  el('relayConnectButton').addEventListener('click', connectRelayForBriefing);
  startWebcamStream();
  el('webcamFeed').onerror = () => setTimeout(startWebcamStream, 1000);

  try {
    const cfg = await jsonFetch(`${JOINT}/api/config`);
    if (cfg.joint_limits) limits = cfg.joint_limits;
  } catch (_) {}
  buildAxes();
  el('pumpSuck').addEventListener('click', () => sendPump('suck'));
  el('pumpBlow').addEventListener('click', () => sendPump('blow'));
  el('pumpOff').addEventListener('click', () => sendPump('off'));
  applyPumpMode('off');
  setControlLock();

  try { applyGameState(await jsonFetch(`${GM}/api/state`)); } catch (_) {}
  setInterval(async () => {
    try { applyGameState(await jsonFetch(`${GM}/api/state`)); } catch (_) {}
  }, 700);

  const armEvents = new EventSource(`${JOINT}/api/events`);
  armEvents.onmessage = e => {
    try {
      const s = JSON.parse(e.data);
      const joints = Array.isArray(s.target) ? s.target : s.joints;
      if (Array.isArray(joints)) {
        currentJoints = joints;
        AXES.forEach((axis, i) => {
          if (document.activeElement === sliders[axis.id]) return;
          const v = Number(joints[i]);
          if (!Number.isFinite(v)) return;
          sliders[axis.id].value = String(v);
          el(`${axis.id}Val`).textContent = `${v.toFixed(1)}°`;
        });
      }
      const relayConnected = !!s.connected && s.link === 'relay';
      if (relayConnected) {
        applyRelayReady(true);
        if (s.enabled && canOperate()) {
          armReady = true;
          el('armStatus').textContent = 'Arm live. Use J1, J2, and J3.';
          setControlLock();
        }
      } else if ((s.connected === false || (s.connected && s.link && s.link !== 'relay')) && !playerReady) {
        applyRelayReady(false);
      }
      if (s.pump_mode) applyPumpMode(s.pump_mode);
    } catch (_) {}
  };
}

init();
</script>
</body>
</html>
